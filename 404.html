<script>
/* Resolve the saved theme BEFORE the stylesheet paints, so there is no flash.
   Same contract as the homepage and games hub. */
(function(){
  var d=document.documentElement,m=window.matchMedia?matchMedia("(prefers-color-scheme: dark)"):null,p="dark";
  try{var v=localStorage.getItem("site-theme");if(v==="system"||v==="light"||v==="dark")p=v;}catch(e){}
  var r=p==="system"?((m&&m.matches)?"dark":"light"):p;
  d.setAttribute("data-theme",r);
  d.setAttribute("data-theme-pref",p);
  var mt=d.querySelector('meta[name="theme-color"]');
  if(mt) mt.setAttribute("content",r==="dark"?"#0b0d10":"#ffffff");
})();
</script>
<style>
