<style>
  .board {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(8, 1fr);
    width: min(560px, 94vw);
    aspect-ratio: 1;
    margin: 0 auto;
    border: 1px solid var(--border-hi);
    border-radius: var(--r-md);
    overflow: hidden;
    touch-action: manipulation;
  }
  .sq {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(1.8rem, 8vw, 3.2rem);
    cursor: pointer;
    user-select: none;
    position: relative;
    line-height: 1;
  }
  /* Chess.com-style green + white board */
  .sq.light { background: #eeeed2; }
  .sq.dark  { background: #769656; }
  .sq.sel   { outline: 3px solid var(--accent); outline-offset: -3px; z-index: 1; }
  .sq.last  { box-shadow: inset 0 0 0 3px rgba(245, 197, 66, 0.55); }
  .sq.hint::after {
    content: "";
    position: absolute;
    width: 28%; height: 28%;
    background: rgba(0, 0, 0, 0.22);
    border-radius: 50%;
  }
  .sq.cap::after {
    content: "";
    position: absolute;
    inset: 6%;
    border: 3px solid rgba(0, 0, 0, 0.35);
    border-radius: 50%;
  }
  .sq.w {
    color: #fff;
    -webkit-text-stroke: 1px #333;
    text-shadow: 0 1px 3px rgba(0,0,0,0.6);
    filter: drop-shadow(0 1px 2px rgba(0,0,0,0.4));
  }
  .sq.b {
    color: #000;
    -webkit-text-stroke: 0.5px #000;
    text-shadow: 0 1px 2px rgba(255,255,255,0.2);
    filter: drop-shadow(0 1px 2px rgba(0,0,0,0.3));
  }

  select {
    background: var(--panel-2);
    color: var(--fg);
    border: 1px solid var(--border-hi);
    border-radius: var(--r-md);
    padding: 8px 10px;
    font-family: inherit;
    font-size: var(--fs-sm);
    min-height: var(--tap);
  }
</style>
</head>
<body class="g-chess"><!--
  Shared slim site-styled back bar — inlined verbatim at the very top of each
  vendored game page (immediately after the opening body tag).

  The tokens below are copied from the portfolio's inline :root set so the
  containment bar matches the site without any network request.

  Per page, the title span text is set to that game's title.
  Per-page additions are appended after this snippet (see task-1-report.md):
  solitaire and wordle get the site's inline favicon (a 404 /favicon.ico would
  otherwise log a console error); solitaire also cancels its flex-centred body
  padding so the bar spans full width; fancy-banana keeps its own inline favicon
  and makes the bar fixed while reserving 48px of body padding for its
  flex-centred, padding-aware canvas.
-->
<style>
.msm-backbar{--bg:#ffffff;--bg-alt:#f5f5f7;--ink:#1d1d1f;--ink-2:#424245;--muted:#6e6e73;--line:#d2d2d7;--blue:#0066cc;--blue-hover:#0077ed;--bar-bg:rgba(255,255,255,.86);--max:1080px;--ease:cubic-bezier(.22,.61,.36,1);box-sizing:border-box;position:sticky;top:0;z-index:2147483000;height:48px;display:flex;align-items:center;padding:0 22px;background:var(--bar-bg);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:13px;line-height:1;letter-spacing:-.01em;color:var(--ink-2)}
html[data-theme="dark"] .msm-backbar,html[data-site-theme="dark"] .msm-backbar{--bg:#0b0b0d;--bg-alt:#161619;--ink:#f5f5f7;--ink-2:#c8c8ce;--muted:#9b9ba3;--line:#2e2e33;--blue:#5aa9ff;--blue-hover:#7fbcff;--bar-bg:rgba(16,16,19,.86)}

.msm-backbar a{color:var(--blue);font-weight:600;text-decoration:none;white-space:nowrap}

.msm-backbar .msm-title{margin-left:auto;color:var(--ink);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

<main class="wrap">
  <div class="topbar">
    <h1>chess</h1>
    <a class="back" href="../">← all games</a>
  </div>
  <div class="panel">
    <div class="row">
      <p class="status" id="status">White to move.</p>
      <p class="status" id="info"></p>
      <button class="btn ghost tool-btn man-trigger" data-man="chess" data-man-title="CHESS(1)" type="button">
        <span class="q">?</span> man

      <select id="level" aria-label="AI level">
        <option value="1">Easy (depth 1)</option>
        <option value="2" selected>Normal (depth 2)</option>
        <option value="3">Hard (depth 3)</option>
      </select>
      <select id="side" aria-label="Your side">
        <option value="w" selected>Play White</option>
        <option value="b">Play Black</option>
      </select>
    </div>
    <p class="footer-note">Tap a piece, then tap a destination. Pawns auto-promote to queen.</p>
  </div>
</main>

<template id="man-chess">
  <h2>Name</h2>
  <p>chess — full rules vs. a small minimax engine.</p>

  <h2>Rules</h2>
  <ul>
    <li>Standard chess: pieces move as they do in real chess, including <strong>castling</strong>, <strong>en passant</strong>, and <strong>pawn promotion</strong> (auto-queens).</li>
    <li>Deliver <strong>checkmate</strong> to win; the game ends in a draw on stalemate, insufficient material, or 50-move rule.</li>
  </ul>

  <h2>Controls</h2>
  <ul>
    <li><strong>Tap</strong> one of your pieces to select it. Legal destinations are highlighted with dots (moves) or rings (captures).</li>
    <li><strong>Tap a highlighted square</strong> to move there. Tap the piece again to deselect.</li>
    <li><code>Undo</code> takes back one full pair of moves (yours + the engine's).</li>
    <li><code>Flip board</code> rotates the view.</li>
    <li>Choose AI strength via the <code>Easy / Normal / Hard</code> selector — deeper search is stronger but slower.</li>
  </ul>

  <h2>Notes</h2>
  <p class="muted">The engine uses minimax with alpha-beta pruning and piece-square tables. At depth 3 it plays a decent casual game.</p>
</template>
