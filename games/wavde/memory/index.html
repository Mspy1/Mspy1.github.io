<script>(function(){var t="system";try{t=localStorage.getItem("site-theme")||"system"}catch(e){}if(t!=="dark"&&t!=="light"){t=window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}var d=document.documentElement;/* wavde owns data-theme for its own UI */d.setAttribute("data-site-theme",t)})();</script>

<meta charset="utf-8">
<title>memory · games</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="description" content="Memory Match — flip pairs of cards, remember positions, clear the board.">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="apple-touch-icon" href="../favicon.svg">

<style>
  .mem {
    display: grid;
    gap: 6px;
    width: min(460px, 92vw);
    margin: 0 auto;
  }
  /* Note: game.js uses `.card` for memory tiles; hub also uses `.card`.
     Scoping to `.mem .card` avoids any cross-bleed. */
  .mem .card {
    aspect-ratio: 1;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(1.4rem, 6vw, 2rem);
    cursor: pointer;
    user-select: none;
    transition: transform 0.15s, background 0.15s, border-color 0.15s;
    min-height: 0;
    padding: 0;
  }
  .mem .card:hover { background: var(--panel); }
  .mem .card.flip { background: var(--panel); border-color: var(--border-hi); }
  .mem .card.match { border-color: var(--accent-2); }
  .mem .card .face { opacity: 0; transition: opacity 0.15s; }
  .mem .card.flip .face, .mem .card.match .face { opacity: 1; }

  select {
    background: var(--panel-2);
    color: var(--fg);
    border: 1px solid var(--border-hi);
    border-radius: var(--r-md);
    padding: 8px 10px;
    font-family: inherit;
    font-size: var(--fs-sm);
    min-height: var(--tap);
  }
</style>
</head>
<body class="g-memory"><!--
  Shared slim site-styled back bar — inlined verbatim at the very top of each
  vendored game page (immediately after the opening body tag).

  The tokens below are copied from the portfolio's inline :root set so the
  containment bar matches the site without any network request.

  Per page, the title span text is set to that game's title.
  Per-page additions are appended after this snippet (see task-1-report.md):
  solitaire and wordle get the site's inline favicon (a 404 /favicon.ico would
  otherwise log a console error); solitaire also cancels its flex-centred body
  padding so the bar spans full width; fancy-banana keeps its own inline favicon
  and makes the bar fixed while reserving 48px of body padding for its
  flex-centred, padding-aware canvas.
-->
<style>
.msm-backbar{--bg:#ffffff;--bg-alt:#f5f5f7;--ink:#1d1d1f;--ink-2:#424245;--muted:#6e6e73;--line:#d2d2d7;--blue:#0066cc;--blue-hover:#0077ed;--bar-bg:rgba(255,255,255,.86);--max:1080px;--ease:cubic-bezier(.22,.61,.36,1);box-sizing:border-box;position:sticky;top:0;z-index:2147483000;height:48px;display:flex;align-items:center;padding:0 22px;background:var(--bar-bg);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:13px;line-height:1;letter-spacing:-.01em;color:var(--ink-2)}
html[data-theme="dark"] .msm-backbar,html[data-site-theme="dark"] .msm-backbar{--bg:#0b0b0d;--bg-alt:#161619;--ink:#f5f5f7;--ink-2:#c8c8ce;--muted:#9b9ba3;--line:#2e2e33;--blue:#5aa9ff;--blue-hover:#7fbcff;--bar-bg:rgba(16,16,19,.86)}
.msm-backbar *{box-sizing:border-box}
.msm-backbar .msm-inner{width:100%;max-width:var(--max);margin:0 auto;display:flex;align-items:center;gap:12px}
.msm-backbar a{color:var(--blue);font-weight:600;text-decoration:none;white-space:nowrap}
.msm-backbar a:hover{color:var(--blue-hover);text-decoration:underline}
.msm-backbar .msm-title{margin-left:auto;color:var(--ink);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:380px){.msm-backbar{padding:0 14px}.msm-backbar .msm-inner{gap:8px}}
</style>
<div class="msm-backbar"><div class="msm-inner"><a href="/games/">← Mspy1 · Games</a><span class="msm-title">Memory Match</span></div></div>


<main class="wrap">
  <div class="topbar">
    <h1>memory</h1>
    <a class="back" href="../">← all games</a>
  </div>
  <div class="panel">
    <div class="row">
      <p class="status" id="status">Flip two. Match all pairs.</p>
      <p class="status">Moves: <span id="moves">0</span> · Time: <span id="time">0</span>s · Best: <span id="best">—</span></p>
      <button class="btn ghost tool-btn man-trigger" data-man="memory" data-man-title="MEMORY(1)" type="button">
        <span class="q">?</span> man
      </button>
    </div>
    <div class="mem" id="board"></div>
    <div class="controls" style="justify-content:center">
      <button class="primary" id="reset">New game</button>
      <select id="size" aria-label="Board size">
        <option value="4">4×4</option>
        <option value="6" selected>6×6</option>
        <option value="8">8×8</option>
      </select>
    </div>
  </div>
</main>

<template id="man-memory">
  <h2>Name</h2>
  <p>memory — flip pairs, clear the board, beat your best time.</p>

  <h2>Rules</h2>
  <ul>
    <li>All cards start face-down. Each symbol appears exactly twice.</li>
    <li>Flip two cards per turn. If they match, they stay up; otherwise they flip back.</li>
    <li>Clear every pair to win.</li>
  </ul>

  <h2>Controls</h2>
  <ul>
    <li><strong>Tap / click</strong> a card to flip it.</li>
    <li><code>New game</code> shuffles a fresh board. Size dropdown switches between 4×4, 6×6, 8×8.</li>
  </ul>

  <h2>Notes</h2>
  <p class="muted">Best time is stored per board size.</p>
</template>

<script defer src="../manpage.js"></script>
<script defer src="../gamekit.js"></script>
<script defer src="game.js"></script>
<script>window.addEventListener("load", () => Manpage.autoOpen("memory"));</script>
</body>
</html>
