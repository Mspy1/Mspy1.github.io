<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1030"/><stop offset=".48" stop-color="#1b2a63"/><stop offset="1" stop-color="#0d3a4d"/>
    </linearGradient>
    <radialGradient id="g1"><stop offset="0" stop-color="#6278ff" stop-opacity=".85"/><stop offset="1" stop-color="#6278ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2"><stop offset="0" stop-color="#20d6bd" stop-opacity=".7"/><stop offset="1" stop-color="#20d6bd" stop-opacity="0"/></radialGradient>
    <radialGradient id="g3"><stop offset="0" stop-color="#8a6bff" stop-opacity=".65"/><stop offset="1" stop-color="#8a6bff" stop-opacity="0"/></radialGradient>
    <linearGradient id="pane" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bcd4ff" stop-opacity=".30"/><stop offset="1" stop-color="#8ff0e2" stop-opacity=".05"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dbe7ff" stop-opacity=".55"/><stop offset="1" stop-color="#9bf0e4" stop-opacity=".12"/>
    </linearGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#cfe0ff" stroke-opacity=".06" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="42"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>
  <g filter="url(#soft)">
    <ellipse cx="330" cy="180" rx="430" ry="330" fill="url(#g1)"/>
    <ellipse cx="1320" cy="250" rx="420" ry="340" fill="url(#g2)"/>
    <ellipse cx="930" cy="920" rx="520" ry="300" fill="url(#g3)"/>
  </g>
  <g transform="translate(1230 500) rotate(-14)" fill="none" stroke="url(#stroke)">
    <circle r="250" stroke-width="2"/>
    <circle r="200" stroke-width="1.6" stroke-opacity=".7"/>
    <circle r="150" stroke-width="1.2" stroke-opacity=".5"/>
    <path d="M-250 0A250 250 0 0 1 250 0" stroke-width="6" stroke-opacity=".45" stroke-linecap="round"/>
    <path d="M0-250A250 250 0 0 1 0 250" stroke-width="3" stroke-opacity=".3" stroke-linecap="round"/>
    <circle cx="120" cy="-90" r="7" fill="#dff5ff" fill-opacity=".7" stroke="none"/>
  </g>
  <g transform="translate(180 470) rotate(8)">
    <rect x="0" y="0" width="250" height="270" rx="30" fill="#a8c4ff" fill-opacity=".07" stroke="#dbe7ff" stroke-opacity=".20" stroke-width="2"/>
  </g>
  <g fill="#eaf3ff" fill-opacity=".55">
    <circle cx="120" cy="120" r="2"/><circle cx="520" cy="90" r="1.6"/><circle cx="760" cy="180" r="2.2"/>
    <circle cx="1480" cy="120" r="1.8"/><circle cx="90" cy="700" r="1.6"/><circle cx="640" cy="620" r="2"/>
    <circle cx="1420" cy="760" r="2.4"/><circle cx="1190" cy="560" r="1.6"/>
  </g>
  <rect y="820" width="1600" height="180" fill="#050b20" fill-opacity=".26"/>
</svg>
